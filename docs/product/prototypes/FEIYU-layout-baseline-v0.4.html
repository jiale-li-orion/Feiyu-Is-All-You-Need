/* ======================================================================
  FEIYU UI BASELINE v0.2  —  QUICK TUNING SURFACE
  Edit these variables first. Other pages inherit their original v0.1 styles.
  --focus-content-width: desktop reading rail
  --chat-font-size: message type size
  --chat-bubble-radius: Dot-style bubble corner radius
  --chat-blue: user message fill
  --home-hero-offset: adjusts home hero up / down
  --home-prompt-width: the home input column
======================================================================= */
:root {
  --focus-content-width: 780px;
  --chat-font-size: 15px;
  --chat-bubble-radius: 23px;
  --chat-blue: #85a6cb;
  --chat-assistant: #f4f4f5;
  --home-hero-offset: 0px;
  --home-prompt-width: 650px;
  --home-accent: #477ecd;
  --home-surface: #eff5ff;
}
/* Mobile four-item navigation */
.tabbar{height:65px;flex-basis:65px;padding:5px 8px 6px}
.tabbar button{width:24%;font-size:11px}
.desktop-logo-button{width:100%;border:0;background:none;text-align:left;cursor:pointer}
.desktop-logo-button:hover{background:#f0f5ff;border-radius:12px}
/* Home: attention -> intention -> conversation */
.home-screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;position:relative;background:radial-gradient(ellipse 105% 70% at 52% 44%,#dfeeff 0%,#eaf4ff 39%,#f7faff 69%,#ffffff 100%);color:#243a62}
.home-top{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:relative;z-index:1}
.home-brand{display:flex;align-items:center;gap:9px;color:#3c79cf;font-size:19px;font-weight:780;letter-spacing:-.045em}
.home-brand-icon .avatar{width:27px;height:27px;flex-basis:27px;border-radius:50%;box-shadow:0 2px 11px #5489bc22}
.home-top-messages{border:0;background:#ffffff8f;color:#526985;border-radius:999px;display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:12px;cursor:pointer}
.home-top-messages .i{width:17px;height:17px}
.home-body{width:min(100%,var(--home-prompt-width));margin:auto;padding:8px 27px 0;display:flex;flex-direction:column;min-height:min(565px,100%);justify-content:center;gap:0}
.home-attentions{display:flex;flex-direction:column;gap:9px;width:100%;margin:0 auto 25px;max-width:530px}
.home-attention{width:100%;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#ffffffa6;border:1px solid #ffffffd9;border-radius:15px;color:#627694;text-align:left;box-shadow:0 3px 18px #6698cb08;transition:transform .18s,background .18s;cursor:pointer}
.home-attention:hover{transform:translateY(-1px);background:#fff}
.home-attention .i{width:15px;height:15px;opacity:.45}
.attention-pip{width:7px;height:7px;border-radius:50%;background:#4c82d0;flex:none}
.attention-pip.soft{background:#9cafc9}
.attention-kind{font-size:11px;color:#6889ba;white-space:nowrap;font-weight:650}
.attention-caption{font-size:12px;color:#495f7d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.home-main{text-align:center;transform:translateY(var(--home-hero-offset));margin:3px 0 25px}
.home-mascot{display:flex;justify-content:center;margin-bottom:13px}

.home-overline{font-size:10px;letter-spacing:.18em;font-weight:700;color:#779ac4}
.home-main h1{font-size:clamp(28px,4vw,40px);font-weight:680;letter-spacing:.06em;line-height:1.3;color:#263f68;margin:16px 0 10px}
.home-main p{font-size:13px;letter-spacing:.05em;color:#8ca1bd;margin:0}
.home-entry{width:100%;max-width:var(--home-prompt-width);margin:0 auto}
.home-compose{background:#ffffffc2;border:1px solid #cbdcee;border-radius:24px;box-shadow:0 12px 44px #6c9bc415,0 0 0 3px #ffffff44;display:flex;flex-direction:column;min-height:148px;padding:17px 18px 13px}
.home-compose textarea{flex:1;width:100%;outline:0;border:0;background:transparent;resize:none;font-size:15px;line-height:1.6;color:#28405e;min-height:74px;max-height:200px}

.home-open-chat{border:0;background:#ffffff80;display:flex;align-items:center;justify-content:center;gap:7px;color:#66809f;font-size:13px;font-weight:620;width:100%;margin-top:15px;height:45px;border-radius:999px;cursor:pointer}
.home-open-chat:hover{background:white;color:#3b70c1}
.home-open-chat .i{width:15px;height:15px}
.home-signature{text-align:center;color:#b0bfd3;font-family:Georgia,serif;font-style:italic;font-size:11px;letter-spacing:.015em;padding:8px 12px 15px}
/* Contacts: regular IM list */
.contacts-search-wrap{padding:12px 19px 11px;background:#f5f6f8;flex:none}
.contacts-search{height:38px;display:flex;align-items:center;gap:9px;padding:0 13px;border-radius:13px;background:#fff;color:#a4a9b1}
.contacts-search .i{width:18px;height:18px;opacity:.66}
.contacts-search input{flex:1;background:none;border:0;outline:0;min-width:0;color:#253a55;font-size:13px}
.contacts-search input::placeholder{color:#aeb5bf}
.contacts-pane{background:#f6f7f9!important}
.contacts-list{background:#fff;min-height:100%}
.contact-group{background:#fff}
.contacts-divider{height:10px;background:#f6f7f9}
.contact-row{min-height:77px;padding:12px 23px;gap:13px}
.contact-row .avatar{width:47px;height:47px;flex:0 0 47px;border-radius:17px;font-size:18px}
.contact-row .row-heading{font-size:15px;font-weight:650;color:#263142}
.contact-row .row-desc{font-size:12px;line-height:1.4;color:#a0a6b0;margin-top:6px}
.contact-row .contact-end{align-self:flex-start;font-size:10px;color:#a8afba;margin-top:7px}
.contact-row:after{left:83px;right:22px;background:#f0f1f4}
.contact-row[hidden]{display:none!important}
.contacts-empty{text-align:center;padding:32px 16px;color:#9eaabd;font-size:13px}
/* Chat: minimal conversation screen, no bottom app nav */
.chat-shell{min-height:0;flex:1;display:flex;flex-direction:column;background:#fff;position:relative}
.chat-topbar{height:81px;flex:0 0 81px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:13px 18px 0;background:linear-gradient(180deg,#fff 60%,#ffffffdc);z-index:2}
.chat-top-action{height:42px;width:42px;border-radius:50%;border:0;background:#f7f7f8;color:#26303e;display:grid;place-items:center;cursor:pointer}
.chat-top-action .i{width:22px;height:22px;stroke-width:2.2}
.chat-top-action:hover{background:#ecf2f9}
.chat-identity{position:absolute;left:50%;top:7px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;color:#242a34;white-space:nowrap;font-size:13px;font-weight:680}
.chat-identity .avatar{width:43px;height:43px;flex:0 0 43px;border-radius:50%}
.chat-shell .messages{padding:18px 19px 20px}
.chat-shell .chat-track{max-width:var(--focus-content-width)}
.chat-shell .date-stamp{font-size:11px;color:#c4c9d1;margin:10px auto 22px}
.chat-shell .message{margin-bottom:20px;gap:0}
.chat-shell .message.assistant{padding-right:22px}
.chat-shell .message.user{padding-left:36px}
.chat-shell .message .msg-body{font-size:var(--chat-font-size);line-height:1.55;max-width:min(83%,660px);padding:11px 16px;border-radius:var(--chat-bubble-radius);color:#1e2229}
.chat-shell .message.assistant .msg-body{background:var(--chat-assistant);border-bottom-left-radius:9px}
.chat-shell .message.user .msg-body{background:var(--chat-blue);color:#fff;border-bottom-right-radius:9px}
.chat-shell .message p{margin:0;letter-spacing:0}
.chat-shell .inline-ref{background:#ffffffd9;border:0;color:#5279a9;margin-top:9px;font-size:12px}
.chat-shell .composer-wrap{padding:10px 18px 22px;background:linear-gradient(0deg,#fff 80%,#ffffffec)}
.chat-shell .composer{display:flex;align-items:center;gap:13px;max-width:var(--focus-content-width);border:1px solid #f0f0f3;background:#f8f8f9;border-radius:999px;box-shadow:none;padding:6px 7px 6px 13px;min-height:55px}
.chat-shell .composer textarea{flex:1;min-width:0;font-size:var(--chat-font-size);line-height:1.48;align-self:center;padding:5px 0;min-height:25px;max-height:140px;resize:none}
.chat-shell .composer textarea::placeholder{color:#adb0b6}
.chat-shell .composer-add,.chat-shell .composer-voice{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:50%;background:transparent;color:#20242b;display:grid;place-items:center;cursor:pointer}
.chat-shell .composer-add .i,.chat-shell .composer-voice .i{width:25px;height:25px;stroke-width:2}
.chat-shell .send-button{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#7198c8;display:grid;place-items:center}
.chat-shell .send-button:disabled{display:none}
.chat-shell .scroll-jump{bottom:105px;right:28px}
.mode-desktop .chat-shell .messages{padding:24px 32px}
.mode-desktop .chat-shell .composer-wrap{padding:12px 32px 27px}
.mode-desktop .home-body{max-width:var(--home-prompt-width);justify-content:center}
.mode-desktop .home-top{padding:0 38px}
.mode-desktop .home-main h1{font-size:38px}
@media(max-width:740px){
 .bar{gap:5px;padding:9px 10px}.bar .review-switch{display:none}

 .home-attentions{gap:7px;margin-bottom:19px}
 .home-attention{height:41px;padding:0 11px;gap:7px}

 .home-mascot .avatar{width:57px;height:57px;flex-basis:57px}

 .home-signature{font-size:10px;padding-bottom:9px}

}

}

.me-avatar-button{width:36px;height:36px;min-width:36px;display:grid;place-items:center;border:1px solid #dce7f4;border-radius:50%;background:linear-gradient(145deg,#f5f9ff,#d6e5f7);color:#5e81b0;cursor:pointer;padding:0;box-shadow:0 1px 5px #4b79b00d}
.me-avatar-button .i{width:19px;height:19px;stroke-width:1.9}

.home-top{justify-content:flex-start}

 $('device').className=`device mode-${size}${screen==='chat'?' focus-mode':''}`;
 $('screen').innerHTML=screen==='chat'?chatPage():screen==='directory'?directoryPage():screen==='cases'?casesPage():screen==='notes'?notesPage():screen==='note-detail'?noteDetailPage():screen==='case-detail'?casePage():screen==='settings'?settingsPage():screen==='settings-detail'?settingsDetailPage():screen==='dashboard'?dashboardPage():'';

 renderTabs();renderSidebar();bindComposer();bindDirectory();renderSheet();
 if(screen==='chat'){
   const scroll=$('message-scroll');

const settingsContent={memory:{title:'个性化与记忆',desc:'调整肥鱼的交流偏好与长期指令。',items:['交流偏好','长期指令','个性化说明']},accounts:{title:'软件连接与权限',desc:'管理软件账号及其读取与操作授权。',items:['QQ','微信','飞书','读取与外发权限']},automation:{title:'自动化与通知',desc:'自动化继续在后台运行，通知由你决定。',items:['重要事项通知','自动化任务','触发与提醒偏好']},team:{title:'肥鱼小队与设备',desc:'管理领域肥鱼、PC 与 Android 执行节点。',items:['大肥鱼','通用肥鱼','专用肥鱼','设备']},appearance:{title:'外观、数据与隐私',desc:'调整界面表现与个人数据选项。',items:['外观主题','角色表现','数据与隐私']}};
function settingsDetailPage(){const c=settingsContent[settingKey]||settingsContent.memory;return `${header(c.title,'',true)}<div class="scroll-pane"><div class="setting-detail page-limit"><p class="hint">${c.desc}</p><div class="setting-list">${c.items.map((name,i)=>`<button class="setting-item" data-act="setting-option" data-value="${esc(name)}"><span class="label">${esc(name)}</span>${settingKey==='automation'&&i===0?`<span class="switch on"></span>`:icon('chevron')}</button>`).join('')}</div></div></div>`}
const dashItems=[['运行概览','monitor','影响工作的异常与待恢复执行'],['自动化与任务','clock','触发、等待与执行记录'],['Source 与设备','devices','读取覆盖与执行节点'],['Agent、模型与工具','agents','肥鱼职责与能力配置'],['资源与限制','grid','用量与预算'],['凭据与诊断','key','授权与故障检查']];
function dashboardPage(){return `${header('后台与开发者','',true)}<div class="scroll-pane"><div class="dashboard page-limit"><h1 class="dash-title">运行与管理</h1><p class="dash-sub">查看确定性运行状态，进入需要管理的对象。</p>${dashItems.map(([name,ic,desc])=>`<button class="dash-row" data-act="dashboard-item" data-value="${name}">${icon(ic)}<span class="d-text"><b>${name}</b><p>${desc}</p></span>${icon('chevron')}</button>`).join('')}</div></div>`}
function renderTabs(){const tabs=[['messages','chat','消息'],['cases','clock','事项'],['notes','book','笔记']];$('tabbar').innerHTML=tabs.map(([id,ic,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}" aria-label="${name}" aria-current="${tab===id?'page':'false'}">${icon(ic)}<span>${name}</span></button>`).join('')}
function renderSidebar(){
 const nav=[['messages','chat','消息'],['cases','clock','事项'],['notes','book','笔记']];
 $('desktop-left').innerHTML=`<button class="desktop-logo desktop-logo-button" data-tab="messages"><span class="d-logo">${icon('spark')}</span><b>FEIYU</b></button><div class="desktop-nav">${nav.map(([key,ic,name])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${icon(ic)}${name}</button>`).join('')}</div><div class="desktop-foot">FEIYU · UI BASELINE 0.4</div>`;
}
function goTab(next){tab=next;screen=next==='messages'?'directory':next;render()}
function goAgent(id){chatReturn='directory';agent=id;tab='messages';screen='chat';render()}
function goNote(id){activeNote=id;tab='notes';screen='note-detail';render()}
function goCase(id){activeCase=id;returnScreen=screen;tab='cases';screen='case-detail';render()}
function back(){
 if(screen==='case-detail'){
  screen=returnScreen||'cases';tab=screen==='directory'||screen==='chat'?'messages':screen==='notes'||screen==='note-detail'?'notes':'cases';
 }else if(screen==='chat'){
  screen=chatReturn==='note-detail'?'note-detail':'directory';tab=screen==='note-detail'?'notes':'messages';
 }else if(screen==='note-detail'){
  screen='notes';tab='notes';
 }else if(screen==='settings-detail'||screen==='dashboard'){
  screen='settings';
 }else if(screen==='settings'){
  screen=profileReturn||'directory';tab=screen==='notes'?'notes':screen==='cases'?'cases':'messages';
 }else{
  screen='directory';tab='messages';
 }
 render();
}
function bindComposer(){if(screen!=='chat')return;const input=$('composer-input'),send=$('send'),voice=document.querySelector('.composer-voice'),scroll=$('message-scroll');let composing=false;
 const adapt=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';const typed=!!input.value.trim();send.disabled=!typed;send.style.display=typed?'grid':'none';voice.style.display=typed?'none':'grid';};adapt();
 input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>composing=false);
 input.addEventListener('input',()=>{draft[agent]=input.value;adapt()});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!composing&&!e.isComposing&&e.keyCode!==229&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendMessage()}});
 scroll.addEventListener('scroll',()=>{const near=scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<60;scrollPinned=near;chatScroll[agent]={top:scroll.scrollTop,atBottom:near};$('scroll-jump')?.classList.toggle('show',!near)});
 $('scroll-jump').addEventListener('click',()=>{scroll.scrollTo({top:scroll.scrollHeight,behavior:'smooth'});scrollPinned=true;$('scroll-jump').classList.remove('show')});
}
function bindDirectory(){if(screen!=='directory')return;const f=$('contact-filter');if(!f)return;const filter=()=>{listQuery=f.value.toLowerCase();let shown=0;document.querySelectorAll('[data-contact-name]').forEach(el=>{const ok=el.dataset.contactName.includes(listQuery);el.hidden=!ok;if(ok)shown++});$('contacts-empty').hidden=shown!==0};f.addEventListener('input',filter);filter()}
function sendMessage(){const input=$('composer-input');if(!input||!input.value.trim())return;const text=input.value.trim();history[agent].push({who:'user',text});draft[agent]='';chatScroll[agent]=null;render();const next=$('composer-input');if(next)next.focus();toast('示例发送：已加入当前会话');}
function renderSheet(){const shade=$('sheet-shade');if(!sheet){shade.classList.remove('show');shade.innerHTML='';return}shade.classList.add('show');const opts=sheet==='attach'?[['file','上传文件（示意）','upload-demo'],['link','添加链接','link-demo']]:sheet==='chat-menu'?[['info','会话信息','chat-info'],['agents','全部会话','directory']]:sheet==='case-menu'?[['clock','暂停跟进','pause-demo'],['archive','关闭事项','close-demo']]:[];
 shade.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-title">${sheet==='attach'?'添加内容':sheet==='chat-menu'?'会话操作':'事项操作'}</div>${opts.map(([ic,label,act])=>`<button class="sheet-option" data-act="${act}">${icon(ic)}<span>${label}</span>${icon('chevron')}</button>`).join('')}<button class="sheet-close" data-act="close-sheet">取消</button></div>`;
}
function showSheet(v){sheet=v;renderSheet()}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function showSplash(){clearTimeout(splashTimer);tab='messages';screen='directory';render();const splash=$('splash');splash.classList.add('show');splashTimer=setTimeout(()=>splash.classList.remove('show'),1250)}
function action(act,value){switch(act){case'back':back();break;case'profile':openProfile();break;case'directory':screen='directory';tab='messages';render();break;case'talk-note':{const n=notes.find(x=>x.id===activeNote);draft.main=`我想和你聊聊《${n?.title||'这篇笔记'}》`;agent='main';tab='messages';chatReturn='note-detail';screen='chat';render();$('composer-input')?.focus();break;}case'voice-demo':toast('语音入口 · 后续接入');break;case'team-settings':settingKey='team';tab='settings';screen='settings-detail';render();break;case'send':sendMessage();break;case'attach':showSheet('attach');break;case'add-attachment':toast('附件选择由实际产品实现');break;case'chat-menu':showSheet('chat-menu');break;case'case-menu':showSheet('case-menu');break;case'close-sheet':sheet=null;renderSheet();break;case'approve':{const c=cases.find(x=>x.id===activeCase);if(c){c.type='working';c.status='待执行';c.subtitle='已记录用户确认，等待实际执行';c.desc='此为布局原型中的确认状态，未对任何外部软件执行操作。';}toast('原型演示：确认已记录');render();break;}case'defer':toast('已保留在待我处理');break;case'view-source':toast('来源详情 · 组件占位');break;case'view-history':toast('执行记录 · 组件占位');break;case'history':toast('历史事项 · 后续页面');break;case'setting-option':{if(value==='重要事项通知'){const el=document.querySelector('.switch');if(el)el.classList.toggle('on');toast('原型演示：偏好已切换')}else toast(value+' · 详情布局待展开');break;}case'dashboard-item':toast(value+' · 管理面板待展开');break;case'upload-demo':toast('选择文件组件待接入');sheet=null;renderSheet();break;case'link-demo':toast('链接输入组件待接入');sheet=null;renderSheet();break;case'chat-info':toast('会话信息面板待展开');sheet=null;renderSheet();break;case'pause-demo':toast('原型演示：事项暂停');sheet=null;renderSheet();break;case'close-demo':toast('原型演示：关闭事项');sheet=null;renderSheet();break;default:break;}}
document.addEventListener('click',e=>{
 const sizeBtn=e.target.closest('[data-size]');if(sizeBtn){size=sizeBtn.dataset.size;document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===sizeBtn));render();document.querySelector('.stage').scrollTop=0;return;}
 if(e.target.closest('#replay-splash')){showSplash();return;}
 const rv=e.target.closest('[data-review]');if(rv){const q=rv.dataset.review;tab=q==='notes'?'notes':'messages';screen=q; if(q==='chat'){agent='main';chatReturn='directory';}render();document.querySelectorAll('[data-review]').forEach(b=>b.classList.toggle('active',b===rv));return;}
 const target=e.target.closest('[data-tab],[data-agent],[data-case],[data-note],[data-setting],[data-act]');if(!target)return;
 if(target.dataset.tab){goTab(target.dataset.tab);return;}
 if(target.dataset.agent){goAgent(target.dataset.agent);return;}
 if(target.dataset.case){goCase(target.dataset.case);return;}
 if(target.dataset.note){goNote(target.dataset.note);return;}
 if(target.dataset.setting){settingKey=target.dataset.setting;screen=settingKey==='dev'?'dashboard':'settings-detail';tab='settings';render();return;}
 if(target.dataset.act)action(target.dataset.act,target.dataset.value);
});
$('sheet-shade').addEventListener('click',e=>{if(e.target===$('sheet-shade')){sheet=null;renderSheet()}});
render();
setTimeout(showSplash,180);
})();
</script>
</body>
</html>
